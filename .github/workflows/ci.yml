name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test?schema=public
  JWT_SECRET: test-secret-key
  JWT_REFRESH_SECRET: test-refresh-key

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Generate Prisma client
      working-directory: ./backend
      run: npx prisma generate
    
    - name: Run database migrations
      working-directory: ./backend
      run: npx prisma migrate deploy
    
    - name: Run backend tests
      working-directory: ./backend
      run: npm test || echo "No tests yet - skipping"
    
    - name: Lint backend code
      working-directory: ./backend
      run: npx eslint . || echo "No linting configured yet"
    
    - name: Check types
      working-directory: ./backend
      run: npx tsc --noEmit || echo "No TypeScript yet"

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci || echo "Frontend not set up yet"
    
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build || echo "Frontend build skipped"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run npm audit
      working-directory: ./backend
      run: npm audit --production || echo "Vulnerabilities found - review"
    
    - name: Check for secrets
      run: |
        if grep -r "secret.*key" --include="*.js" --include="*.env" backend/; then
          echo "⚠️ Warning: Possible secret keys in code"
        fi

  notify:
    needs: [test-backend, test-frontend, security-scan]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Check status
      run: |
        if [ "${{ needs.test-backend.result }}" = "success" ] && \
           [ "${{ needs.test-frontend.result }}" = "success" ]; then
          echo "✅ All tests passed!"
        else
          echo "❌ Some tests failed"
          exit 1
        fi
