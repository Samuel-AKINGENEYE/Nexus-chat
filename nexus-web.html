<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Community Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #333; font-size: 24px; }
        .nav { display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: #667eea; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
        .nav-btn:hover { background: #5a67d8; }
        .notification-bell { position: relative; cursor: pointer; font-size: 24px; }
        .notification-count { position: absolute; top: -5px; right: -10px; background: #e94560; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; min-width: 18px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card h2 { color: #333; margin-bottom: 15px; font-size: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #5a67d8; }
        .post-list, .comment-list, .spaces-list { max-height: 400px; overflow-y: auto; }
        .post-item, .comment-item, .space-item { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .token-display { background: #f0fdf4; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; word-break: break-all; margin-top: 10px; }
        .response { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Nexus Community Platform</h1>
            <div class="nav">
                <div class="notification-bell" onclick="window.location.href='/notification-feed.html'">
                    🔔
                    <span id="notificationCount" class="notification-count">0</span>
                </div>
                <button class="nav-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>🔐 User Info</h2>
                <div id="userInfo">Loading...</div>
                <div id="tokenDisplay" class="token-display"></div>
            </div>
            
            <div class="card">
                <h2>🏠 Create Space</h2>
                <input type="text" id="spaceName" placeholder="Space Name">
                <textarea id="spaceDesc" placeholder="Description" rows="2"></textarea>
                <select id="spaceVisibility">
                    <option value="PUBLIC">Public</option>
                    <option value="RESTRICTED">Restricted</option>
                </select>
                <button onclick="createSpace()">Create Space</button>
                <button onclick="listSpaces()">List Spaces</button>
                <div id="spacesList" class="spaces-list"></div>
            </div>
            
            <div class="card">
                <h2>📝 Create Post</h2>
                <input type="text" id="postTitle" placeholder="Title">
                <textarea id="postContent" placeholder="Content" rows="3"></textarea>
                <input type="text" id="postSpaceSlug" placeholder="Space Slug">
                <button onclick="createPost()">Create Post</button>
                <button onclick="listPosts()">List Posts</button>
                <div id="postsList" class="post-list"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>💬 Comments</h2>
            <input type="text" id="commentPostId" placeholder="Post ID">
            <textarea id="commentContent" placeholder="Your comment" rows="2"></textarea>
            <button onclick="createComment()">Post Comment</button>
            <div id="commentsList" class="comment-list"></div>
        </div>
        
        <div class="card">
            <h2>📡 API Response</h2>
            <div class="response" id="response">Ready...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        let currentToken = localStorage.getItem('token') || '';
        
        async function apiCall(endpoint, method, data, needsAuth = true) {
            const headers = { 'Content-Type': 'application/json' };
            if (needsAuth && currentToken) {
                headers['Authorization'] = `Bearer ${currentToken}`;
            }
            const response = await fetch(`${API_BASE}${endpoint}`, { method, headers, body: data ? JSON.stringify(data) : undefined });
            const result = await response.json();
            document.getElementById('response').innerHTML = JSON.stringify(result, null, 2);
            if (result.tokens) {
                currentToken = result.tokens.accessToken;
                localStorage.setItem('token', currentToken);
            }
            return result;
        }
        
        async function loadUnreadCount() {
            if (!currentToken) return;
            const result = await apiCall('/notifications/unread/count', 'GET', null, true);
            document.getElementById('notificationCount').innerText = result.unreadCount || 0;
        }
        
        async function logout() {
            localStorage.removeItem('token');
            window.location.reload();
        }
        
        async function createSpace() {
            const data = { name: document.getElementById('spaceName').value, description: document.getElementById('spaceDesc').value, visibility: document.getElementById('spaceVisibility').value };
            await apiCall('/spaces', 'POST', data, true);
        }
        
        async function listSpaces() {
            const result = await apiCall('/spaces', 'GET');
            if (result.spaces) {
                document.getElementById('spacesList').innerHTML = result.spaces.map(s => `<div class="space-item">🏠 ${s.name}<br><small>Slug: ${s.slug}</small></div>`).join('');
            }
        }
        
        async function createPost() {
            const data = { title: document.getElementById('postTitle').value, content: document.getElementById('postContent').value, spaceSlug: document.getElementById('postSpaceSlug').value, type: 'TEXT' };
            await apiCall('/posts', 'POST', data, true);
        }
        
        async function listPosts() {
            const slug = document.getElementById('postSpaceSlug').value;
            if (!slug) return;
            const result = await apiCall(`/posts/space/${slug}`, 'GET');
            if (result.posts) {
                document.getElementById('postsList').innerHTML = result.posts.map(p => `<div class="post-item">📝 ${p.title}<br><small>By ${p.author.displayName}</small></div>`).join('');
            }
        }
        
        async function createComment() {
            const data = { content: document.getElementById('commentContent').value, postId: document.getElementById('commentPostId').value };
            await apiCall('/comments', 'POST', data, true);
        }
        
        // Check login status
        if (currentToken) {
            document.getElementById('userInfo').innerHTML = '✅ Logged in';
            loadUnreadCount();
            setInterval(loadUnreadCount, 30000);
        } else {
            document.getElementById('userInfo').innerHTML = '<a href="/nexus-web.html" style="color: #667eea;">Login to continue</a>';
        }
        
        document.getElementById('tokenDisplay').innerHTML = currentToken ? `Token: ${currentToken.substring(0, 50)}...` : 'Not logged in';
    </script>
</body>
</html>
