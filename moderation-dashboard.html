<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Moderation Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #333; }
        .nav { display: flex; gap: 15px; }
        .nav-btn { background: #667eea; color: white; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .report-item { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #e94560; }
        .report-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .report-reason { color: #e94560; font-weight: bold; }
        .report-actions { margin-top: 10px; display: flex; gap: 10px; }
        .btn-approve { background: #10b981; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #ef4444; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-dismiss { background: #6b7280; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; text-align: center; }
        .stat-number { font-size: 36px; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
        .log-item { background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 4px; font-size: 14px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { background: #e5e7eb; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
        .tab.active { background: #667eea; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Moderation Dashboard</h1>
            <div class="nav">
                <button class="nav-btn" onclick="window.location.href='/nexus-web.html'">Back to App</button>
                <button class="nav-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card"><div class="stat-number" id="pendingCount">-</div><div class="stat-label">Pending Reports</div></div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('reports')">📋 Reports</button>
            <button class="tab" onclick="showTab('logs')">📜 Moderation Logs</button>
        </div>
        
        <div id="reportsTab" class="tab-content active">
            <div class="card" id="reportsList">Loading reports...</div>
        </div>
        
        <div id="logsTab" class="tab-content">
            <div class="card" id="logsList">Loading logs...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        let currentToken = localStorage.getItem('token') || '';
        
        if (!currentToken) {
            window.location.href = '/nexus-web.html';
        }
        
        async function apiCall(endpoint, method = 'GET', data = null) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${currentToken}`
                },
                body: data ? JSON.stringify(data) : undefined
            });
            return response.json();
        }
        
        async function loadReports() {
            const result = await apiCall('/moderation/reports');
            const reportsList = document.getElementById('reportsList');
            document.getElementById('pendingCount').innerText = result.reports?.length || 0;
            
            if (!result.reports || result.reports.length === 0) {
                reportsList.innerHTML = '<div style="text-align: center; padding: 40px;">No pending reports</div>';
                return;
            }
            
            reportsList.innerHTML = result.reports.map(report => `
                <div class="report-item">
                    <div class="report-header">
                        <span>Reported by: ${report.reporter?.username || 'Unknown'}</span>
                        <span class="report-reason">Reason: ${report.reason}</span>
                    </div>
                    <div><strong>Content:</strong> ${report.post?.title || report.comment?.content || 'N/A'}</div>
                    <div class="report-actions">
                        <button class="btn-approve" onclick="resolveReport('${report.id}', 'approve')">✅ Approve (Keep)</button>
                        <button class="btn-delete" onclick="resolveReport('${report.id}', 'delete')">🗑️ Delete Content</button>
                        <button class="btn-dismiss" onclick="resolveReport('${report.id}', 'dismiss')">❌ Dismiss Report</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function resolveReport(reportId, action) {
            await apiCall(`/moderation/reports/${reportId}/resolve`, 'PUT', { action, modNotes: `Resolved with action: ${action}` });
            loadReports();
            loadLogs();
        }
        
        async function loadLogs() {
            const result = await apiCall('/moderation/logs');
            const logsList = document.getElementById('logsList');
            
            if (!result.logs || result.logs.length === 0) {
                logsList.innerHTML = '<div style="text-align: center; padding: 40px;">No moderation logs</div>';
                return;
            }
            
            logsList.innerHTML = result.logs.map(log => `
                <div class="log-item">
                    <strong>${log.moderator?.username}</strong> performed <strong>${log.action}</strong> on ${log.targetType}
                    <br><small>Reason: ${log.reason} | ${new Date(log.createdAt).toLocaleString()}</small>
                </div>
            `).join('');
        }
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tab}Tab`).classList.add('active');
            
            if (tab === 'reports') loadReports();
            if (tab === 'logs') loadLogs();
        }
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/nexus-web.html';
        }
        
        // Initial load
        loadReports();
        loadLogs();
        
        // Auto-refresh every 10 seconds
        setInterval(() => {
            loadReports();
            loadLogs();
        }, 10000);
    </script>
</body>
</html>
